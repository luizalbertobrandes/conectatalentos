<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackathon do Protagonismo - Mapa do Futuro</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .print-only { display: none; }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white; color: black; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('guia');
      const [studentData, setStudentData] = useState({
        nome: '',
        turma: '',
        fortalezas: ['', '', ''],
        desenvolver: ['', '', ''],
        objetivos: ['', '', ''],
        conexoes: ['', '', ''],
        planoAcao: [
          { acao: '', prazo: 'Curto Prazo' },
          { acao: '', prazo: 'Médio Prazo' },
          { acao: '', prazo: 'Longo Prazo' }
        ],
        midiaUrl: '',
        feedbacks: []
      });

      const [newFeedback, setNewFeedback] = useState({ autor: '', mensagem: '' });
      const [qrCodeUrl, setQrCodeUrl] = useState('');

      useEffect(() => {
        const dataToEncode = studentData.midiaUrl || JSON.stringify({
          nome: studentData.nome || 'Estudante',
          metas: studentData.objetivos.filter(Boolean)
        });
        
        if (window.QRCode) {
          window.QRCode.toDataURL(dataToEncode, { width: 200, margin: 2 }, (err, url) => {
            if (!err) setQrCodeUrl(url);
          });
        }
      }, [studentData]);

      const handleAddFeedback = (e) => {
        e.preventDefault();
        if (!newFeedback.autor || !newFeedback.mensagem) return;
        setStudentData(prev => ({
          ...prev,
          feedbacks: [...prev.feedbacks, { ...newFeedback, id: Date.now() }]
        }));
        setNewFeedback({ autor: '', mensagem: '' });
      };

      const exportarTXT = () => {
        const conteudo = `==================================================
MAPA DO PROTAGONISMO PESSOAL E PROFISSIONAL
==================================================
Estudante: ${studentData.nome || 'Não informado'}
Turma/Grupo: ${studentData.turma || 'Não informado'}
Data de Exportação: ${new Date().toLocaleDateString('pt-BR')}

--------------------------------------------------
1. AUTOAVALIAÇÃO DE COMPETÊNCIAS (ÁRVORE DE TALENTOS)
--------------------------------------------------
[Pontos Fortes / Raízes & Tronco]
${studentData.fortalezas.map((f) => `- ${f || 'Pendente'}`).join('\n')}

[Competências a Desenvolver / Galhos & Folhas]
${studentData.desenvolver.map((d) => `- ${d || 'Pendente'}`).join('\n')}

--------------------------------------------------
2. OBJETIVOS DE FUTURO (METAS DE CARREIRA E PESSOAIS)
--------------------------------------------------
${studentData.objetivos.map((o) => `- ${o || 'Pendente'}`).join('\n')}

--------------------------------------------------
3. REDE DE CONEXÕES (MENTORES, ESCOLA E COMUNIDADE)
--------------------------------------------------
${studentData.conexoes.map((c) => `- ${c || 'Pendente'}`).join('\n')}

--------------------------------------------------
4. PLANO DE AÇÃO CONCRETO
--------------------------------------------------
${studentData.planoAcao.map(p => `[${p.prazo}]: ${p.acao || 'Pendente'}`).join('\n')}

--------------------------------------------------
5. RECURSOS DIGITAIS
--------------------------------------------------
Link de Apresentação/Mídia: ${studentData.midiaUrl || 'Nenhum link adicionado'}

--------------------------------------------------
6. MURAL DE FEEDBACKS & INCENTIVOS DA TURMA
--------------------------------------------------
${studentData.feedbacks.length > 0 
  ? studentData.feedbacks.map(f => `- ${f.autor}: "${f.mensagem}"`).join('\n')
  : 'Nenhum feedback recebido até o momento.'}

==================================================
Hackathon do Protagonismo — Construindo o Mapa do Futuro
==================================================`;

        const blob = new Blob([conteudo], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Mapa_Protagonismo_${(studentData.nome || 'Estudante').replace(/\s+/g, '_')}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 no-print">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-3">
                <div className="bg-indigo-600 p-2 rounded-lg text-white font-bold text-xl">🚀</div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                    Hackathon do Protagonismo
                  </h1>
                  <p className="text-xs text-slate-400">Construindo o Mapa do Futuro</p>
                </div>
              </div>
              <nav className="flex space-x-2 bg-slate-900 p-1 rounded-xl border border-slate-700">
                <button
                  onClick={() => setActiveTab('guia')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                    activeTab === 'guia' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  📋 Guia da Oficina
                </button>
                <button
                  onClick={() => setActiveTab('mapa')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                    activeTab === 'mapa' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  🗺️ Meu Mapa Interativo
                </button>
                <button
                  onClick={() => setActiveTab('pitch')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                    activeTab === 'pitch' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  🎤 Pitch & QR Code
                </button>
              </nav>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6">
            {/* ABAS DO GUIA DA OFICINA */}
            {activeTab === 'guia' && (
              <div className="space-y-6">
                <div className="bg-slate-800/80 border border-slate-700 p-6 rounded-2xl">
                  <h2 className="text-2xl font-bold text-indigo-400 mb-2">Visão Geral do Hackathon</h2>
                  <p className="text-slate-300 leading-relaxed">
                    Esta oficina integrada propõe a criação de um <strong>Mapa do Protagonismo Pessoal e Profissional</strong>.
                    Combinamos dinâmicas relacionais humanas, colagens manuais e recursos de tecnologia digital para estruturar metas de vida, projetos de carreira e conexões sociais.
                  </p>
                </div>

                <div className="grid md:grid-cols-2 gap-6">
                  {/* Etapa 1 */}
                  <div className="bg-slate-800/50 border border-slate-700/60 p-5 rounded-xl">
                    <div className="flex items-center space-x-2 text-indigo-400 font-semibold mb-3">
                      <span className="bg-indigo-900/50 border border-indigo-700 px-2 py-1 rounded text-xs">Etapa 1</span>
                      <h3>Acolhimento & Teia do Protagonismo</h3>
                    </div>
                    <ul className="text-sm text-slate-300 space-y-2 list-disc list-inside">
                      <li><strong>Dinâmica Inicial:</strong> Formação de grupos e compartilhamento de habilidades marcantes.</li>
                      <li><strong>Teia do Protagonismo:</strong> Lançamento do rolo de barbante ao reconhecer talentos no colega, materializando o trabalho em rede.</li>
                    </ul>
                  </div>

                  {/* Etapa 2 */}
                  <div className="bg-slate-800/50 border border-slate-700/60 p-5 rounded-xl">
                    <div className="flex items-center space-x-2 text-indigo-400 font-semibold mb-3">
                      <span className="bg-indigo-900/50 border border-indigo-700 px-2 py-1 rounded text-xs">Etapa 2</span>
                      <h3>Prototipagem Física (Mão na Massa)</h3>
                    </div>
                    <ul className="text-sm text-slate-300 space-y-2 list-disc list-inside">
                      <li>Construção do mapa em cartolina ou papel kraft.</li>
                      <li>Autoavaliação (Árvore de Talentos em post-its).</li>
                      <li>Objetivos de futuro com colagens de revistas/jornais.</li>
                      <li>Mapeamento da rede de apoio e plano de ação.</li>
                    </ul>
                  </div>

                  {/* Etapa 3 */}
                  <div className="bg-slate-800/50 border border-slate-700/60 p-5 rounded-xl">
                    <div className="flex items-center space-x-2 text-indigo-400 font-semibold mb-3">
                      <span className="bg-indigo-900/50 border border-indigo-700 px-2 py-1 rounded text-xs">Etapa 3</span>
                      <h3>Integração Digital & QR Code</h3>
                    </div>
                    <ul className="text-sm text-slate-300 space-y-2 list-disc list-inside">
                      <li>Foto/Digitalização do cartaz para plataformas (Canva/Padlet).</li>
                      <li>Geração e impressão de QR Code direto no aplicativo.</li>
                      <li>Colagem do QR Code na cartolina física para acesso a vídeos/áudios.</li>
                    </ul>
                  </div>

                  {/* Etapa 4 */}
                  <div className="bg-slate-800/50 border border-slate-700/60 p-5 rounded-xl">
                    <div className="flex items-center space-x-2 text-indigo-400 font-semibold mb-3">
                      <span className="bg-indigo-900/50 border border-indigo-700 px-2 py-1 rounded text-xs">Etapa 4</span>
                      <h3>Pitch de Protagonismo & Feedbacks</h3>
                    </div>
                    <ul className="text-sm text-slate-300 space-y-2 list-disc list-inside">
                      <li>Apresentação de 2 a 3 minutos para a turma.</li>
                      <li>Demonstração do recurso interativo do QR Code.</li>
                      <li>Troca de post-its com incentivos e feedbacks empáticos.</li>
                    </ul>
                  </div>
                </div>

                <div className="text-center pt-4">
                  <button
                    onClick={() => setActiveTab('mapa')}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-8 py-3 rounded-xl shadow-lg transition-all"
                  >
                    Começar a Preencher Meu Mapa Digital
                  </button>
                </div>
              </div>
            )}

            {/* ABA DO MAPA INTERATIVO */}
            {activeTab === 'mapa' && (
              <div className="space-y-6">
                {/* Identificação */}
                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 grid md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">NOME DO ESTUDANTE</label>
                    <input
                      type="text"
                      placeholder="Ex: Ana Silva"
                      value={studentData.nome}
                      onChange={(e) => setStudentData({ ...studentData, nome: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">TURMA / GRUPO</label>
                    <input
                      type="text"
                      placeholder="Ex: 3º Ano B - Grupo 2"
                      value={studentData.turma}
                      onChange={(e) => setStudentData({ ...studentData, turma: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>

                {/* Blocos do Mapa */}
                <div className="grid md:grid-cols-2 gap-6">
                  {/* Bloco 1 */}
                  <div className="bg-slate-800/90 border border-slate-700 p-5 rounded-2xl space-y-4">
                    <h3 className="font-bold text-lg text-emerald-400 flex items-center gap-2">
                      <span>🌳</span> 1. Autoavaliação (Árvore de Talentos)
                    </h3>
                    <div>
                      <p className="text-xs text-slate-400 mb-2 font-medium">Pontos Fortes (Raízes & Tronco)</p>
                      {studentData.fortalezas.map((val, idx) => (
                        <input
                          key={idx}
                          type="text"
                          placeholder={`Ponto Forte ${idx + 1}`}
                          value={val}
                          onChange={(e) => {
                            const newArr = [...studentData.fortalezas];
                            newArr[idx] = e.target.value;
                            setStudentData({ ...studentData, fortalezas: newArr });
                          }}
                          className="w-full bg-slate-900/80 border border-slate-700/80 rounded-lg p-2 text-sm text-slate-200 mb-2 focus:outline-none focus:border-emerald-500"
                        />
                      ))}
                    </div>
                    <div>
                      <p className="text-xs text-slate-400 mb-2 font-medium">Competências a Desenvolver (Galhos & Folhas)</p>
                      {studentData.desenvolver.map((val, idx) => (
                        <input
                          key={idx}
                          type="text"
                          placeholder={`Desenvolver ${idx + 1}`}
                          value={val}
                          onChange={(e) => {
                            const newArr = [...studentData.desenvolver];
                            newArr[idx] = e.target.value;
                            setStudentData({ ...studentData, desenvolver: newArr });
                          }}
                          className="w-full bg-slate-900/80 border border-slate-700/80 rounded-lg p-2 text-sm text-slate-200 mb-2 focus:outline-none focus:border-emerald-500"
                        />
                      ))}
                    </div>
                  </div>

                  {/* Bloco 2 */}
                  <div className="bg-slate-800/90 border border-slate-700 p-5 rounded-2xl space-y-4">
                    <h3 className="font-bold text-lg text-amber-400 flex items-center gap-2">
                      <span>🎯</span> 2. Objetivos de Futuro
                    </h3>
                    <p className="text-xs text-slate-400">Projetos de carreira, metas pessoais e sonhos</p>
                    {studentData.objetivos.map((val, idx) => (
                      <input
                        key={idx}
                        type="text"
                        placeholder={`Objetivo ${idx + 1}`}
                        value={val}
                        onChange={(e) => {
                          const newArr = [...studentData.objetivos];
                          newArr[idx] = e.target.value;
                          setStudentData({ ...studentData, objetivos: newArr });
                        }}
                        className="w-full bg-slate-900/80 border border-slate-700/80 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500"
                      />
                    ))}
                  </div>

                  {/* Bloco 3 */}
                  <div className="bg-slate-800/90 border border-slate-700 p-5 rounded-2xl space-y-4">
                    <h3 className="font-bold text-lg text-cyan-400 flex items-center gap-2">
                      <span>🕸️</span> 3. Rede de Conexões
                    </h3>
                    <p className="text-xs text-slate-400">Colegas, mentores, professores, escola e comunidade</p>
                    {studentData.conexoes.map((val, idx) => (
                      <input
                        key={idx}
                        type="text"
                        placeholder={`Conexão / Mentor ${idx + 1}`}
                        value={val}
                        onChange={(e) => {
                          const newArr = [...studentData.conexoes];
                          newArr[idx] = e.target.value;
                          setStudentData({ ...studentData, conexoes: newArr });
                        }}
                        className="w-full bg-slate-900/80 border border-slate-700/80 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500"
                      />
                    ))}
                  </div>

                  {/* Bloco 4 */}
                  <div className="bg-slate-800/90 border border-slate-700 p-5 rounded-2xl space-y-4">
                    <h3 className="font-bold text-lg text-purple-400 flex items-center gap-2">
                      <span>📌</span> 4. Plano de Ação Concreto
                    </h3>
                    <p className="text-xs text-slate-400">Passos práticos para aplicar no dia a dia</p>
                    {studentData.planoAcao.map((item, idx) => (
                      <div key={idx} className="flex gap-2">
                        <span className="text-xs font-semibold bg-slate-900 text-purple-400 px-2 py-2 rounded border border-slate-700 w-28 text-center self-center">
                          {item.prazo}
                        </span>
                        <input
                          type="text"
                          placeholder="Ação prática..."
                          value={item.acao}
                          onChange={(e) => {
                            const newArr = [...studentData.planoAcao];
                            newArr[idx].acao = e.target.value;
                            setStudentData({ ...studentData, planoAcao: newArr });
                          }}
                          className="flex-1 bg-slate-900/80 border border-slate-700/80 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500"
                        />
                      </div>
                    ))}
                  </div>
                </div>

                {/* Mídia Digital */}
                <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                  <h3 className="font-bold text-indigo-400 mb-2">🔗 Link Digital Integrado (Canva, YouTube, Drive)</h3>
                  <p className="text-xs text-slate-400 mb-3">Insira aqui a URL do seu mural digital, vídeo de apresentação ou portfólio para ser codificado no QR Code.</p>
                  <input
                    type="url"
                    placeholder="https://canva.com/design/... ou link do vídeo"
                    value={studentData.midiaUrl}
                    onChange={(e) => setStudentData({ ...studentData, midiaUrl: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
              </div>
            )}

            {/* ABA DE PITCH & QR CODE */}
            {activeTab === 'pitch' && (
              <div className="space-y-6">
                <div className="grid md:grid-cols-3 gap-6">
                  {/* Cartão QR Code */}
                  <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col items-center justify-center text-center">
                    <h3 className="font-bold text-slate-200 mb-1">Seu QR Code do Protagonismo</h3>
                    <p className="text-xs text-slate-400 mb-4">Escaneie para visualizar o conteúdo ou link vinculado</p>
                    
                    {qrCodeUrl ? (
                      <div className="bg-white p-3 rounded-xl shadow-md mb-4">
                        <img src=qr.png alt="QR Code" className="w-44 h-44" />
                      </div>
                    ) : (
                      <div className="w-44 h-44 bg-slate-900 rounded-xl flex items-center justify-center text-xs text-slate-500 mb-4">
                        Gerando QR Code...
                      </div>
                    )}

                    <button
                      onClick={() => window.print()}
                      className="w-full bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-2 px-4 rounded-lg transition-all"
                    >
                      🖨️ Imprimir QR Code / Cartaz
                    </button>
                  </div>

                  {/* Resumo do Pitch */}
                  <div className="md:col-span-2 bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                    <div className="flex justify-between items-center">
                      <h3 className="font-bold text-lg text-indigo-400">Roteiro de Pitch (2 a 3 minutos)</h3>
                      <button
                        onClick={exportarTXT}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-2 rounded-lg shadow transition-all flex items-center gap-1"
                      >
                        📥 Exportar TXT Completo
                      </button>
                    </div>

                    <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 text-sm space-y-2">
                      <p><strong>1. Introdução:</strong> "Olá, meu nome é {studentData.nome || '[Seu Nome]'}..."</p>
                      <p><strong>2. Pontos Fortes:</strong> "Me destaco nas seguintes competências: {studentData.fortalezas.filter(Boolean).join(', ') || '...'}"</p>
                      <p><strong>3. Futuro & Conexões:</strong> "Meu principal objetivo é {studentData.objetivos[0] || '...'}, contando com apoio de {studentData.conexoes[0] || '...'}"</p>
                      <p><strong>4. Ação Prática:</strong> "Meu próximo passo será {studentData.planoAcao[0].acao || '...'}"</p>
                    </div>

                    {/* Mural de Feedbacks */}
                    <div className="pt-2">
                      <h4 className="font-semibold text-sm text-slate-300 mb-3">💬 Mural de Feedbacks dos Colegas</h4>
                      
                      <form onSubmit={handleAddFeedback} className="flex gap-2 mb-4">
                        <input
                          type="text"
                          placeholder="Seu nome"
                          value={newFeedback.autor}
                          onChange={(e) => setNewFeedback({ ...newFeedback, autor: e.target.value })}
                          className="w-1/3 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none"
                        />
                        <input
                          type="text"
                          placeholder="Mensagem de incentivo ou sugestão..."
                          value={newFeedback.mensagem}
                          onChange={(e) => setNewFeedback({ ...newFeedback, mensagem: e.target.value })}
                          className="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none"
                        />
                        <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 rounded-lg font-semibold">
                          Enviar
                        </button>
                      </form>

                      <div className="space-y-2 max-h-40 overflow-y-auto">
                        {studentData.feedbacks.length === 0 ? (
                          <p className="text-xs text-slate-500 italic">Nenhum feedback registrado ainda. Colegas podem comentar durante o Pitch!</p>
                        ) : (
                          studentData.feedbacks.map((f) => (
                            <div key={f.id} className="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 text-xs">
                              <span className="font-bold text-indigo-400">{f.autor}: </span>
                              <span className="text-slate-300">"{f.mensagem}"</span>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Área Exclusiva para Impressão */}
          <div className="print-only p-8 text-black bg-white">
            <h1 className="text-2xl font-bold text-center mb-1">Hackathon do Protagonismo — Mapa do Futuro</h1>
            <p className="text-center text-sm mb-6">Estudante: {studentData.nome || '___________'} | Turma: {studentData.turma || '___________'}</p>

            <div className="grid grid-cols-2 gap-4 text-xs">
              <div className="border p-3 rounded">
                <h3 className="font-bold mb-2">1. AUTOAVALIAÇÃO</h3>
                <p><strong>Fortalezas:</strong> {studentData.fortalezas.filter(Boolean).join(', ')}</p>
                <p><strong>A Desenvolver:</strong> {studentData.desenvolver.filter(Boolean).join(', ')}</p>
              </div>

              <div className="border p-3 rounded">
                <h3 className="font-bold mb-2">2. OBJETIVOS DE FUTURO</h3>
                {studentData.objetivos.map((o, i) => <p key={i}>• {o}</p>)}
              </div>

              <div className="border p-3 rounded">
                <h3 className="font-bold mb-2">3. REDE DE CONEXÕES</h3>
                {studentData.conexoes.map((c, i) => <p key={i}>• {c}</p>)}
              </div>

              <div className="border p-3 rounded">
                <h3 className="font-bold mb-2">4. PLANO DE AÇÃO</h3>
                {studentData.planoAcao.map((p, i) => <p key={i}>• [{p.prazo}] {p.acao}</p>)}
              </div>
            </div>

            {qrCodeUrl && (
              <div className="mt-6 flex flex-col items-center">
                <p className="text-xs font-bold mb-2">ACESSE O CONTEÚDO DIGITAL INTEGRADO:</p>
                <img src={qrCodeUrl} alt="QR Code Impresso" className="w-32 h-32" />
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
