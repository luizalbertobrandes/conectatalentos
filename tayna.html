          location.pathname === "/play" ||

          location.pathname.indexOf("/game/") === 0;
        var navTab = null;

        if (!navTab && isNativeApp) {

      // Player and My Games routes use a true-black canvas from the first
      // parser paint. React continues this through useShellBlackCanvas; doing
      // the same work here prevents the generic purple wordmark fallback from
      // flashing before the route bundle and thumbnail are ready.
      (function () {
        var path = location.pathname;
        var pureBlackRoute =
          path === "/play" ||
          path.indexOf("/play/") === 0 ||
          path.indexOf("/game/") === 0 ||
          path === "/my-games" ||
          path.indexOf("/my-games/") === 0;
        if (!pureBlackRoute) return;
        document.documentElement.style.background = "#000";
        document.body.style.background = "#000";
        var fallback = document.querySelector("[data-root-paint-fallback]");
        if (fallback) fallback.style.background = "#000";
        var wordmark = document.querySelector("[data-root-wordmark-fallback]");
        if (wordmark) wordmark.style.display = "none";
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute("content", "#000000");
      })();
    </script>
